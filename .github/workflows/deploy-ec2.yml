name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # Tools come from uv.lock, so a new ruff release cannot break a deploy
      - name: Install dependencies
        run: uv sync --locked

      - name: Check code quality with Ruff
        run: uv run ruff check .

      - name: Check code formatting with Ruff
        run: uv run ruff format --check --diff .

  # Builds the base image and the four app images in one bake run (see
  # docker/docker-bake.hcl). Each app is built on the base image from the same
  # run, not on base:latest from the registry, so a pull request that changes
  # dependencies is built and tested with them (pull requests push nothing).
  build:
    needs: code-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build images (and push them, except for pull requests)
        uses: docker/bake-action@v6
        env:
          IMAGE_PREFIX: ${{ env.IMAGE_PREFIX }}
          # Every image is tagged with the full commit SHA; deploy uses that tag
          TAG: ${{ github.sha }}
          PUSH_LATEST: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          GHA_CACHE: true
        with:
          source: .
          files: docker/docker-bake.hcl
          push: ${{ github.event_name != 'pull_request' }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    # One deploy at a time: a newer deploy waits for the running one, and
    # replaces any older deploy still waiting, so the newest commit wins
    concurrency:
      group: deploy-ec2
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          # Plain OpenSSH from the runner image: nothing is downloaded at run time,
          # so an outage of GitHub release downloads cannot break the deploy.
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2
          chmod 600 ~/.ssh/ec2
          cat >> ~/.ssh/config <<EOF
          Host ec2
            HostName $EC2_HOST
            User ec2-user
            IdentityFile ~/.ssh/ec2
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 30
            ConnectionAttempts 3
            ServerAliveInterval 30
            ServerAliveCountMax 4
          EOF

      - name: Deploy to EC2 via SSH
        timeout-minutes: 30
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Sent as the ssh command (not on stdin), like appleboy/ssh-action
          # did; -n gives the remote side an empty stdin for docker exec.
          # IMAGE_TAG (a commit SHA, so safe to inline) selects the images
          # built for this commit, and the same commit's compose file.
          script="export IMAGE_TAG=$IMAGE_TAG"$'\n'$(cat <<'REMOTE'
          set -e

          # Clone or update repository (for docker-compose and Caddyfile), at
          # the commit being deployed rather than whatever main is now
          cd ~/quant-finance || git clone https://github.com/koysor/quant-finance.git ~/quant-finance
          cd ~/quant-finance
          git fetch origin
          git reset --hard "$IMAGE_TAG"

          # Stop existing containers (both named project and legacy 'docker' project)
          cd docker
          docker-compose -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
          docker-compose -p docker -f docker-compose.prod.yml down --remove-orphans 2>/dev/null || true
          docker-compose down --remove-orphans 2>/dev/null || true
          cd ..

          # Stop nginx if previously installed (Caddy now handles reverse proxy)
          sudo systemctl stop nginx 2>/dev/null || true
          sudo systemctl disable nginx 2>/dev/null || true

          # Ensure Caddy certificate volume exists (survives prune)
          docker volume create caddy_data 2>/dev/null || true

          # Cleanup to free disk space before pulling
          # Note: no --volumes flag so caddy_data (external) is preserved
          docker system prune -af || true
          docker builder prune -af || true
          sudo rm -rf /tmp/* 2>/dev/null || true

          # Pull the app images built for this commit (they contain the base
          # image's layers, which are shared and downloaded only once)
          for app in quant-finance options fixed-income portfolio-management; do
            docker pull "ghcr.io/koysor/quant-finance/$app:$IMAGE_TAG"
          done
          docker pull caddy:2-alpine

          # Pull maths-python image (prune -af removes it since it runs outside this compose project)
          docker pull ghcr.io/koysor/maths-python:latest

          # Pull flash cards image (same reason: it runs in its own compose project)
          docker pull ghcr.io/koysor/quant-finance-flash-cards:latest || true

          # Start services with this commit's images (IMAGE_TAG is read by
          # docker-compose.prod.yml)
          cd docker
          docker-compose -f docker-compose.prod.yml up -d

          # Restart maths-python (separate compose project, destroyed by prune -af)
          cd ~/maths-python 2>/dev/null && git fetch origin && git reset --hard origin/main || git clone https://github.com/koysor/maths-python.git ~/maths-python
          cd ~/maths-python/docker
          docker-compose -f docker-compose.prod.yml up -d

          # Restart flash cards, only once it has been set up on this host (docker/.env exists)
          if [ -f ~/quant-finance-flash-cards/docker/.env ]; then
            cd ~/quant-finance-flash-cards && git fetch origin && git reset --hard origin/main
            cd docker
            docker-compose -f docker-compose.prod.yml up -d
          fi
          REMOTE
          )
          ssh -n ec2 "$script"

      - name: Health check
        timeout-minutes: 10
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Sent as the ssh command (not on stdin), like appleboy/ssh-action
          # did; -n gives the remote side an empty stdin for docker exec.
          script="export IMAGE_TAG=$IMAGE_TAG"$'\n'$(cat <<'REMOTE'
          set -e
          echo "Waiting for apps and Caddy to start..."
          sleep 45

          # Verify all containers are running (including Caddy)
          SERVICES="quant-finance options fixed-income portfolio-management caddy"
          for service in $SERVICES; do
            if ! docker ps | grep -q "$service"; then
              echo "Container $service is not running!"
              docker logs quant-finance-${service}-1 2>/dev/null || docker logs ${service} 2>/dev/null || true
              exit 1
            fi
          done

          # Check Streamlit health endpoints via docker exec
          cd ~/quant-finance/docker
          docker-compose -f docker-compose.prod.yml exec -T quant-finance curl -f http://localhost:8501/_stcore/health && echo " Quant Finance OK"
          docker-compose -f docker-compose.prod.yml exec -T options curl -f http://localhost:8501/_stcore/health && echo " Options OK"
          docker-compose -f docker-compose.prod.yml exec -T fixed-income curl -f http://localhost:8501/_stcore/health && echo " Fixed Income OK"
          docker-compose -f docker-compose.prod.yml exec -T portfolio-management curl -f http://localhost:8501/_stcore/health && echo " Portfolio OK"

          # Check maths-python health endpoint
          cd ~/maths-python/docker
          docker-compose -f docker-compose.prod.yml exec -T maths-python curl -f http://localhost:8501/maths/_stcore/health && echo " Maths Python OK"

          # Check flash cards health endpoint (skipped until it has been set up on this host)
          if [ -f ~/quant-finance-flash-cards/docker/.env ]; then
            cd ~/quant-finance-flash-cards/docker
            docker-compose -f docker-compose.prod.yml exec -T flashcards curl -f http://localhost:8000/ > /dev/null && echo " Flash Cards OK"
          fi

          # Check Caddy is responding on port 80
          curl -sf -o /dev/null http://localhost:80 && echo " Caddy HTTP OK"

          echo "All health checks passed!"
          REMOTE
          )
          ssh -n ec2 "$script"

      - name: Deployment summary
        run: |
          echo "Deployed to EC2 with Caddy HTTPS reverse proxy"
          echo "Apps available at:"
          echo "  - https://koysor.duckdns.org/ (Quant Finance)"
          echo "  - https://koysor.duckdns.org/options/ (Options)"
          echo "  - https://koysor.duckdns.org/fixed-income/ (Fixed Income)"
          echo "  - https://koysor.duckdns.org/portfolio/ (Portfolio Management)"
          echo "  - https://koysor.duckdns.org/maths/ (Maths Python)"
          echo "  - https://koysor.duckdns.org/flashcards/ (Flash Cards)"
