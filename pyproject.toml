[project]
name = "quant-finance"
version = "0.1.0"
description = "Quantitative Finance Examples"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Runtime dependencies only - these are installed in Docker images
    "duckdb>=1.5.6",
    "matplotlib>=3.10.3",
    "networkx>=3.4.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "scipy>=1.15.2",
    "streamlit>=1.66.1",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    # Development tools - not installed in Docker images
    "jupyter>=1.1.1",
    "marimo>=0.25.1",
    "mypy>=1.18.0",
    "pre-commit>=3.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "sqlglot>=28.6.0",
    "sympy>=1.14.0",
]
docs = [
    "mkdocstrings-python>=2.0.11",
    "zensical>=0.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_finance"]

[tool.ruff.lint]
# Pin the rule set: Ruff 0.17 widened the defaults, which broke CI (unpinned ruff).
select = ["E4", "E7", "E9", "F", "W605"]

[tool.mypy]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "quant_finance.options.*",
    "quant_finance.portfolio.*",
    "quant_finance.pricing.*",
    "quant_finance.rates.*",
    "quant_finance.stochastic.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_any_generics = true
warn_return_any = true

[tool.coverage.run]
source = ["quant_finance"]

[tool.coverage.report]
# Library coverage was 71% when this was set; raise it as coverage grows
fail_under = 70
