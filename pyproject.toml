[project]
name = "quant-finance"
version = "0.1.0"
description = "Quantitative Finance Examples"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    # Runtime dependencies only - these are installed in Docker images
    "duckdb>=1.5.6",
    "matplotlib>=3.10.3",
    "networkx>=3.4.2",
    "pandas>=3.0.6",
    "scipy>=1.15.2",
    "sqlglot>=28.6.0",
    "streamlit>=1.66.1",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    # Development tools - not installed in Docker images
    "black[jupyter]>=26.1.0",
    "jupyter>=1.1.1",
    "marimo>=0.25.1",
    "pre-commit>=3.0.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
]

[tool.ruff.lint]
# Pin the rule set: Ruff 0.17 widened the defaults, which broke CI (unpinned ruff).
select = ["E4", "E7", "E9", "F"]
